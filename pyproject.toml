[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sna-ai-agent-engine"
version = "0.8.0"
description = "Reusable, provider-neutral AI agent runtime for SNA AI"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
