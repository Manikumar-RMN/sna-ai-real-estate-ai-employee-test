[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sna-ai-agent-engine"
version = "2.3.0"
description = "Reusable, provider-neutral AI agent runtime for SNA AI with pluggable tools, knowledge, and LLM providers"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.23,<5",
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["core*", "examples*", "api*"]
